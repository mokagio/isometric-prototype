name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The paid pack is committed as ciphertext, so it has to be opened before
      # the build copies `public/` across. A fork has no key: it still deploys,
      # with Amelia drawn from one of the skins that travel in the clear.
      - name: Decrypt the art that cannot be committed in the clear
        run: |
          if [ -z "${AGE_KEY:-}" ]; then
            echo "No AGE_KEY set — building without the encrypted art."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y age
          npm run art:decrypt
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}

      # A project page is served from /<repo>/, so asset URLs need that prefix.
      - run: npm run build -- --base=/${GITHUB_REPOSITORY#*/}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
