<!doctype html>
<html lang="en">
  <head>
    <title>Games Playground</title>
    <style>
      :root {
        --ww-ink: #f4e4c1;
        --ww-panel: #3b2a1c;
        --ww-edge: #6b4f34;
      }
      html, body {
        min-height: 100%;
        background: #1b2b1a;
        color: var(--ww-ink);
        font-family: var(--ww-pixel);
      }
      /* The grass is drawn once per size and sits still while the list scrolls. */
      #backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .ww-home {
        position: relative; /* over the fixed canvas */
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
        /* Insets, not flat padding: the page is viewport-fit=cover, so in
           landscape the notch would otherwise sit on the first button. */
        /* The bottom clears the fixed footer, so the last game is never under it. */
        padding: max(56px, var(--ww-inset-top)) max(20px, var(--ww-inset-right))
          calc(max(40px, var(--ww-inset-bottom)) + 44px) max(20px, var(--ww-inset-left));
        text-align: center;
      }
      .ww-title {
        margin: 0 0 40px;
        font-size: clamp(26px, 8vw, 44px);
        line-height: 1.4;
        text-shadow: 0 3px 5px rgba(0, 0, 0, 0.8); /* it sits straight on bright grass */
      }

      .ww-games {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* The menu button's shape and press, widened to hold a name. */
      .ww-play {
        display: block;
        padding: 20px 22px;
        font-size: clamp(14px, 4vw, 19px);
        line-height: 1.4;
        text-decoration: none;
        color: var(--ww-ink);
        background: var(--ww-panel);
        border: 3px solid var(--ww-edge);
        border-radius: 14px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      @media (hover: hover) {
        .ww-play:hover {
          background: #4a3524;
        }
      }
      .ww-play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }

      /* Held at the foot of the screen rather than the end of the list, so it is
         there however few games there are. Padded by the inset, not a flat
         value: the page runs under the home indicator. */
      .ww-foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 12px var(--ww-inset-right) var(--ww-inset-bottom) var(--ww-inset-left);
        text-align: center;
        font-size: clamp(9px, 2.6vw, 11px);
      }
      /* The title's own ink and shadow: gold is the colour of a link everywhere
         else here, but on grass this bright it is the one thing you cannot read. */
      .ww-foot a {
        color: var(--ww-ink);
        text-decoration: underline;
        /* Clear of the glyphs: at this size the pixels sit right on the baseline. */
        text-underline-offset: 4px;
        text-shadow: 0 3px 5px rgba(0, 0, 0, 0.85);
      }
      .ww-foot a:hover { color: #c9a86a; }
    </style>
  </head>
  <body>
    <canvas id="backdrop"></canvas>
    <main class="ww-home">
      <h1 class="ww-title">Games Playground</h1>
      <ul class="ww-games" id="games"></ul>
      <p class="ww-foot"><a href="credits.html">Credits</a></p>
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
