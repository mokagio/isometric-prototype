<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Whispering Woods</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2b1a;
        /* Suppress the flash the UA paints over a tapped element. */
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .ww-menu {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        font-family: Georgia, "Times New Roman", serif;
        user-select: none;
      }
      .ww-menu-btn {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        font-size: 22px;
        color: #f4e4c1;
        background: #3b2a1c;
        border: 3px solid #6b4f34;
        border-radius: 10px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
        /* A long press on iOS otherwise selects the glyph and raises the loupe. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      @media (hover: hover) {
        .ww-menu-btn:hover {
          background: #4a3524;
        }
      }
      .ww-menu-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      .ww-menu-panel {
        margin-top: 8px;
        min-width: 168px;
        padding: 6px;
        background: #3b2a1c;
        border: 3px solid #6b4f34;
        border-radius: 10px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      .ww-menu-title {
        padding: 6px 10px 8px;
        color: #c9a86a;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .ww-menu-item {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        text-align: left;
        text-decoration: none;
        font: inherit;
        font-size: 16px;
        color: #f4e4c1;
        background: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      /* Touch taps leave :hover stuck on the item, so keep it to pointer devices. */
      @media (hover: hover) {
        .ww-menu-item:hover {
          background: #4a3524;
        }
      }

      .ww-dpad {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: grid;
        grid-template-areas:
          ". up ."
          "left down right";
        gap: 6px;
        font-family: Georgia, "Times New Roman", serif;
        user-select: none;
        touch-action: none;
      }
      .ww-dpad-btn {
        font-size: 18px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
