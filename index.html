<!doctype html>
<html lang="en">
  <head>
    <title>Games Playground</title>
    <style>
      :root {
        --ww-ink: #f4e4c1;
        --ww-panel: #3b2a1c;
        --ww-edge: #6b4f34;
      }
      html, body {
        min-height: 100%;
        background: #1b2b1a;
        color: var(--ww-ink);
        font-family: var(--ww-pixel);
      }
      /* The grass is drawn once per size and sits still while the list scrolls. */
      #backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .ww-home {
        position: relative; /* over the fixed canvas */
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
        /* Insets, not flat padding: the page is viewport-fit=cover, so in
           landscape the notch would otherwise sit on the first button. */
        padding: max(56px, var(--ww-inset-top)) max(20px, var(--ww-inset-right))
          max(40px, var(--ww-inset-bottom)) max(20px, var(--ww-inset-left));
        text-align: center;
      }
      .ww-title {
        margin: 0 0 40px;
        font-size: clamp(26px, 8vw, 44px);
        line-height: 1.4;
        text-shadow: 0 3px 5px rgba(0, 0, 0, 0.8); /* it sits straight on bright grass */
      }

      .ww-games {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* The menu button's shape and press, widened to hold a name. */
      .ww-play {
        display: block;
        padding: 20px 22px;
        font-size: clamp(14px, 4vw, 19px);
        line-height: 1.4;
        text-decoration: none;
        color: var(--ww-ink);
        background: var(--ww-panel);
        border: 3px solid var(--ww-edge);
        border-radius: 14px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      @media (hover: hover) {
        .ww-play:hover {
          background: #4a3524;
        }
      }
      .ww-play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }

      .ww-foot {
        margin: 36px 0 0;
      }
      /* Quieter than a game button, but still on its own ground: pixel type this
         small is unreadable straight on the grass. */
      .ww-foot a {
        display: inline-block;
        padding: 9px 16px;
        font-size: clamp(10px, 3vw, 12px);
        color: #c9a86a;
        text-decoration: none;
        background: rgba(27, 43, 26, 0.72);
        border-radius: 10px;
      }
      .ww-foot a:hover { color: var(--ww-ink); }
    </style>
  </head>
  <body>
    <canvas id="backdrop"></canvas>
    <main class="ww-home">
      <h1 class="ww-title">Games Playground</h1>
      <ul class="ww-games" id="games"></ul>
      <p class="ww-foot"><a href="credits.html">Credits</a></p>
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
