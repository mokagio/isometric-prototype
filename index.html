<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Playground</title>
    <style>
      /* Relative, not root-absolute: in production the site is served from
         /<repo>/, where /fonts/... is somebody else's page. */
      @font-face {
        font-family: "Press Start 2P";
        src: url("fonts/PressStart2P-Regular.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        --ww-ink: #f4e4c1;
        --ww-panel: #3b2a1c;
        --ww-edge: #6b4f34;
        --ww-pixel: "Press Start 2P", "Courier New", monospace;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1b2b1a;
        color: var(--ww-ink);
        font-family: var(--ww-pixel);
        -webkit-tap-highlight-color: transparent;
      }
      /* The grass is drawn once per size and sits still while the list scrolls. */
      #backdrop {
        position: fixed;
        inset: 0;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: none;
      }

      .ww-home {
        position: relative; /* over the fixed canvas */
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
        padding: 56px 20px 40px;
        text-align: center;
      }
      .ww-title {
        margin: 0 0 40px;
        font-size: clamp(26px, 8vw, 44px);
        line-height: 1.4;
        text-shadow: 0 3px 5px rgba(0, 0, 0, 0.8); /* it sits straight on bright grass */
      }

      .ww-games {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* The menu button's shape and press, widened to hold a name. */
      .ww-play {
        display: block;
        padding: 20px 22px;
        font-size: clamp(14px, 4vw, 19px);
        line-height: 1.4;
        text-decoration: none;
        color: var(--ww-ink);
        background: var(--ww-panel);
        border: 3px solid var(--ww-edge);
        border-radius: 14px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      @media (hover: hover) {
        .ww-play:hover {
          background: #4a3524;
        }
      }
      .ww-play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <canvas id="backdrop"></canvas>
    <main class="ww-home">
      <h1 class="ww-title">Games Playground</h1>
      <ul class="ww-games" id="games"></ul>
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
