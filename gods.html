<!doctype html>
<html lang="en">
  <head>
    <title>Battle of the Gods | Games Playground</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%238e1b16'/><path d='M3 11 C3 4 13 4 13 11 L11 11 L11 13 L9 13 L9 9 L7 9 L7 13 L5 13 L5 11 Z' fill='%23e8b83e'/></svg>"
    />
    <style>
      :root {
        --gd-gold: #e8b83e;
        --gd-gold-deep: #9c6b2f;
        --gd-ink: #2a1d14;
        --gd-cream: #fbf3df;
        --gd-red: #8e1b16;
        --gd-panel: rgba(42, 29, 20, 0.82);
        --gd-serif: Georgia, "Times New Roman", serif;
      }
      /* A class that sets `display` would otherwise beat the attribute. */
      [hidden] { display: none !important; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: #cfe6f2;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: auto;
      }

      /* Touch zones: stick on the left half, camera on the right. */
      .gd-touch { position: fixed; inset: 0; }
      .gd-zone { position: absolute; top: 0; bottom: 0; touch-action: none; }
      .gd-zone-left { left: 0; width: 50%; }
      .gd-zone-right { right: 0; width: 50%; }
      .gd-stick {
        position: fixed;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        background: rgba(251, 243, 223, 0.18);
        border: 3px solid rgba(251, 243, 223, 0.6);
        box-sizing: border-box;
        pointer-events: none;
      }
      .gd-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: rgba(251, 243, 223, 0.85);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      /* Sword and shield under the right thumb. */
      .gd-pads {
        position: fixed;
        right: var(--ww-inset-right);
        bottom: var(--ww-inset-bottom);
        width: 170px;
        height: 150px;
      }
      .gd-btn {
        position: absolute;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 4px solid var(--gd-gold);
        background: radial-gradient(circle at 50% 35%, #a8322a, var(--gd-red));
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.25);
        padding: 0;
        cursor: pointer;
        touch-action: none;
      }
      .gd-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
      .gd-attack { right: 0; bottom: 0; width: 92px; height: 92px; }
      .gd-shield {
        left: 0;
        top: 0;
        width: 70px;
        height: 70px;
        background: radial-gradient(circle at 50% 35%, #4f86c8, #2f5f9e);
      }
      @media (pointer: fine) {
        .gd-pads { display: none; }
      }

      .gd-interact {
        position: fixed;
        left: 50%;
        bottom: calc(var(--ww-inset-bottom) + 120px);
        transform: translateX(-50%);
        padding: 12px 22px;
        font: 600 18px var(--gd-serif);
        color: var(--gd-ink);
        background: var(--gd-cream);
        border: 3px solid var(--gd-gold);
        border-radius: 999px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        cursor: pointer;
        animation: gd-bob 1.2s ease-in-out infinite;
      }
      @media (pointer: fine) {
        .gd-interact::after { content: "  (E)"; opacity: 0.6; }
      }
      @keyframes gd-bob { 50% { transform: translate(-50%, -4px); } }

      /* Hearts and purse, top left. */
      .gd-corner {
        position: fixed;
        top: var(--ww-inset-top);
        left: var(--ww-inset-left);
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .gd-hearts { display: flex; flex-wrap: wrap; gap: 2px; max-width: 150px; }
      .gd-heart { position: relative; width: 26px; height: 26px; }
      .gd-heart svg { width: 26px; height: 26px; display: block; }
      .gd-heart-empty { fill: rgba(42, 29, 20, 0.45); stroke: var(--gd-cream); stroke-width: 1.6; }
      .gd-heart-fill { position: absolute; left: 0; top: 0; height: 26px; overflow: hidden; }
      .gd-heart-fill path { fill: #e8352a; stroke: var(--gd-cream); stroke-width: 1.6; }
      .gd-purse {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: flex-start;
        padding: 3px 10px 3px 4px;
        border-radius: 999px;
        background: var(--gd-panel);
        color: var(--gd-cream);
        font: 700 16px var(--gd-serif);
      }
      .gd-coin {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #ffe68a, #f0b622 60%, #b07a10);
        border: 2px solid #8a5a0a;
        box-sizing: border-box;
        flex: none;
      }

      /* Armour worn, under the purse: a dim outline until the piece is on. */
      .gd-kit {
        display: flex;
        gap: 3px;
        padding: 3px 6px;
        align-self: flex-start;
        border-radius: 999px;
        background: var(--gd-panel);
      }
      .gd-pip svg { width: 22px; height: 22px; display: block; }
      .gd-kit .gd-pip path, .gd-kit .gd-pip rect { fill: rgba(251, 243, 223, 0.12); stroke: rgba(251, 243, 223, 0.45); stroke-width: 1.6; }
      .gd-kit .gd-pip .gd-crest { fill: rgba(251, 243, 223, 0.12); }
      .gd-kit .gd-pip[data-kit="bronze"] path, .gd-kit .gd-pip[data-kit="bronze"] rect { fill: #d9a04a; stroke: #fbe3a8; }
      .gd-kit .gd-pip[data-kit="bronze"] .gd-crest { fill: #4f86c8; }
      .gd-kit .gd-pip[data-kit="ares"] path, .gd-kit .gd-pip[data-kit="ares"] rect { fill: #b3271f; stroke: var(--gd-gold); }
      .gd-kit .gd-pip[data-kit="ares"] .gd-crest { fill: #1a0a08; }
      .gd-kit .gd-pip[data-kit="poseidon"] path, .gd-kit .gd-pip[data-kit="poseidon"] rect { fill: #2f9a92; stroke: var(--gd-gold); }
      .gd-kit .gd-pip[data-kit="poseidon"] .gd-crest { fill: #f2f8f8; }
      .gd-kit .gd-pip[data-kit="hades"] path, .gd-kit .gd-pip[data-kit="hades"] rect { fill: #2a2430; stroke: #5fe08a; }
      .gd-kit .gd-pip[data-kit="hades"] .gd-crest { fill: #5fe08a; }
      .gd-kit .gd-pip[data-kit="zeus"] path, .gd-kit .gd-pip[data-kit="zeus"] rect { fill: #f2ecd8; stroke: var(--gd-gold); }
      .gd-kit .gd-pip[data-kit="zeus"] .gd-crest { fill: #4ab0ff; }

      /* Compass along the top: where the god is, and the way home. */
      .gd-compass {
        position: fixed;
        top: calc(var(--ww-inset-top) + 6px);
        left: 50%;
        transform: translateX(-50%);
        width: min(46vw, 360px);
        height: 34px;
        pointer-events: none;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--gd-panel) 18%, var(--gd-panel) 82%, transparent);
      }
      .gd-compass::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 2px;
        border: 5px solid transparent;
        border-top-color: var(--gd-gold);
        transform: translateX(-50%);
      }
      /* Upright on a phone there is no room beside the hearts: it drops below them. */
      @media (max-width: 560px) {
        .gd-compass { top: calc(var(--ww-inset-top) + 132px); width: 70vw; }
        body .gd-boss { top: calc(var(--ww-inset-top) + 132px); width: 80vw; }
        body .gd-interact { bottom: calc(var(--ww-inset-bottom) + 175px); }
      }
      .gd-compass-strip {
        position: absolute;
        inset: 0 12%;
        overflow: hidden;
      }
      .gd-compass-tick, .gd-compass-mark {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }
      .gd-compass-tick { font: 700 12px var(--gd-serif); color: rgba(251, 243, 223, 0.55); }
      .gd-compass-mark { display: flex; align-items: center; gap: 4px; font: italic 700 12px var(--gd-serif); color: var(--gd-cream); }
      .gd-compass-mark span {
        width: 10px;
        height: 10px;
        transform: rotate(45deg);
        background: var(--gd-gold);
        border: 1.5px solid var(--gd-ink);
      }
      .gd-compass-mark[data-id="colosseum"] span { background: #d8382c; }
      .gd-compass-mark[data-id="village"] span { background: #2a8fd0; }
      .gd-compass-mark[data-id="volcano"] span { background: #f06a1e; }
      .gd-compass-mark[data-id="olympus"] span { background: #ffd23a; }

      /* The god's health, top centre. */
      .gd-boss {
        position: fixed;
        top: calc(var(--ww-inset-top) + 6px);
        left: 50%;
        transform: translateX(-50%);
        width: min(70vw, 420px);
        text-align: center;
        pointer-events: none;
      }
      .gd-boss-name {
        font: italic 700 16px var(--gd-serif);
        color: var(--gd-cream);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        margin-bottom: 4px;
        letter-spacing: 0.04em;
      }
      .gd-boss-bar {
        height: 12px;
        border: 2px solid var(--gd-gold);
        border-radius: 999px;
        background: rgba(42, 29, 20, 0.7);
        overflow: hidden;
      }
      .gd-boss-bar div {
        height: 100%;
        background: linear-gradient(#e0473c, #9b1c18);
        transition: width 0.25s;
      }

      /* Big words in the middle of the screen. */
      .gd-banner {
        position: fixed;
        left: 0;
        right: 0;
        top: 30%;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.94);
        transition: opacity 0.4s, transform 0.4s;
      }
      .gd-banner.is-on { opacity: 1; transform: none; }
      .gd-banner h2 {
        margin: 0;
        font: italic 700 clamp(32px, 9vw, 64px) var(--gd-serif);
        color: var(--gd-cream);
        letter-spacing: 0.03em;
        text-shadow: 0 3px 0 var(--gd-red), 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      .gd-banner p {
        margin: 6px 16px 0;
        font: 600 clamp(15px, 4vw, 20px) var(--gd-serif);
        color: var(--gd-cream);
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      }

      /* The blacksmith's counter. */
      .gd-shop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 12, 6, 0.45);
        padding: var(--ww-inset-top) var(--ww-inset-right) var(--ww-inset-bottom) var(--ww-inset-left);
        z-index: 2;
      }
      .gd-shop-card {
        width: min(100%, 380px);
        max-height: 100%;
        overflow: auto;
        box-sizing: border-box;
        padding: 18px;
        background: var(--gd-cream);
        border: 4px solid var(--gd-gold-deep);
        border-radius: 16px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
        color: var(--gd-ink);
        font-family: var(--gd-serif);
      }
      .gd-shop-head { display: flex; align-items: center; justify-content: space-between; }
      .gd-shop-head h2 { margin: 0; font: italic 700 26px var(--gd-serif); }
      .gd-shop-lede { margin: 6px 0 12px; color: #6b4f34; }
      .gd-shop-row {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-top: 2px dashed rgba(156, 107, 47, 0.35);
      }
      .gd-piece svg { width: 40px; height: 40px; display: block; }
      .gd-piece path, .gd-piece rect { fill: #c8913a; stroke: var(--gd-ink); stroke-width: 1.4; }
      .gd-piece .gd-crest { fill: #2f6fb5; }
      .gd-shop-name { font-size: 18px; font-weight: 700; }
      .gd-shop-buy {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 86px;
        justify-content: center;
        padding: 10px 14px;
        font: 700 17px var(--gd-serif);
        color: var(--gd-cream);
        background: var(--gd-red);
        border: 3px solid var(--gd-gold);
        border-radius: 12px;
        cursor: pointer;
      }
      .gd-shop-buy:disabled { background: #a89a86; border-color: #c9bca6; cursor: default; }
      .gd-shop-close {
        width: 100%;
        margin-top: 14px;
        padding: 12px;
        font: 700 17px var(--gd-serif);
        color: var(--gd-ink);
        background: #f0dfb4;
        border: 3px solid var(--gd-gold-deep);
        border-radius: 12px;
        cursor: pointer;
      }

      /* A phone on its side: the counter has to fit in 390 points of height. */
      @media (max-height: 500px) {
        .gd-shop-card { width: min(100%, 560px); padding: 12px 16px; }
        .gd-shop-lede { margin: 2px 0 6px; }
        .gd-shop-row { padding: 4px 0; }
        .gd-piece svg { width: 32px; height: 32px; }
        .gd-shop-buy { padding: 6px 12px; }
        .gd-shop-close { margin-top: 8px; padding: 8px; }
      }

      .gd-keys {
        position: fixed;
        left: var(--ww-inset-left);
        bottom: var(--ww-inset-bottom);
        margin: 0;
        padding: 8px 12px;
        list-style: none;
        font: 13px var(--gd-serif);
        color: var(--gd-cream);
        background: var(--gd-panel);
        border-radius: 10px;
        pointer-events: none;
      }
      .gd-keys kbd { font: 700 12px var(--gd-serif); color: var(--gd-gold); }
      @media (pointer: coarse) {
        .gd-keys { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <ul class="gd-keys">
      <li><kbd>WASD</kbd> walk · <kbd>drag</kbd> or <kbd>← →</kbd> look</li>
      <li><kbd>click</kbd> or <kbd>Space</kbd> sword · <kbd>right-click</kbd> or <kbd>Shift</kbd> shield</li>
    </ul>
    <script type="module" src="/src/gods/main.ts"></script>
  </body>
</html>
