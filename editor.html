<!doctype html>
<html lang="en">
  <head>
    <title>Map Editor | Games Playground</title>
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        background: #1b2b1a;
        font-family: Georgia, "Times New Roman", serif;
      }
      #editor {
        display: flex;
        height: 100%;
        position: relative;
      }
      #sidebar {
        /* The sidebar is against the left edge, the one a landscape notch eats.
           Added to the width as well as the padding, so the cutout costs the
           controls nothing rather than squeezing them. */
        width: calc(200px + env(safe-area-inset-left, 0px));
        flex: 0 0 auto;
        height: 100%;
        box-sizing: border-box;
        padding: calc(14px + env(safe-area-inset-top, 0px)) 14px
          calc(24px + env(safe-area-inset-bottom, 0px))
          calc(14px + env(safe-area-inset-left, 0px));
        overflow-y: auto;
        background: #2c2016;
        border-right: 3px solid #6b4f34;
        color: #f4e4c1;
        user-select: none;
      }
      #board-canvas {
        flex: 1 1 auto;
        min-width: 0;
        cursor: crosshair;
      }

      .ed-back {
        display: inline-block;
        margin-bottom: 12px;
        color: #c9a86a;
        text-decoration: none;
        font-size: 15px;
      }
      .ed-back:hover { color: #f4e4c1; }

      .ed-heading {
        margin: 14px 0 8px;
        color: #c9a86a;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .ed-palette {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .ed-swatch {
        padding: 3px;
        background: #3b2a1c;
        border: 2px solid #6b4f34;
        border-radius: 8px;
        cursor: pointer;
        line-height: 0;
      }
      .ed-swatch canvas { width: 100%; height: auto; image-rendering: pixelated; }
      .ed-swatch:hover { border-color: #9a7345; }
      .ed-swatch.selected { border-color: #7cc24a; background: #46351f; }

      .ed-tools { display: flex; gap: 6px; }
      .ed-tool {
        flex: 1;
        padding: 9px 0;
        font: inherit;
        font-size: 15px;
        color: #f4e4c1;
        background: #3b2a1c;
        border: 2px solid #6b4f34;
        border-radius: 8px;
        cursor: pointer;
      }
      .ed-tool:hover { border-color: #9a7345; }
      .ed-tool.active { background: #56a03a; color: #10240c; border-color: #7cc24a; }

      .ed-height { display: flex; align-items: center; gap: 8px; }
      .ed-step {
        width: 40px;
        height: 40px;
        font-size: 16px;
        color: #f4e4c1;
        background: #3b2a1c;
        border: 2px solid #6b4f34;
        border-radius: 8px;
        cursor: pointer;
      }
      .ed-step:hover { border-color: #9a7345; }
      .ed-height-value {
        flex: 1;
        text-align: center;
        font-size: 22px;
        color: #f4e4c1;
      }

      .ed-map { display: flex; flex-direction: column; gap: 6px; }
      .ed-action {
        padding: 10px 0;
        font: inherit;
        font-size: 15px;
        color: #f4e4c1;
        background: #3b2a1c;
        border: 2px solid #6b4f34;
        border-radius: 8px;
        cursor: pointer;
      }
      .ed-action:hover { border-color: #9a7345; }
      .ed-action-go { background: #56a03a; color: #10240c; border-color: #7cc24a; }
      .ed-action-go:hover { border-color: #a8e07a; }

      .ed-hint {
        margin-top: 16px;
        color: #8a6f52;
        font-size: 12px;
        line-height: 1.5;
      }

      /* Pan pad: a compass of arrows over the bottom-right of the board. */
      .ed-pan {
        position: absolute;
        right: var(--ww-inset-right);
        bottom: var(--ww-inset-bottom);
        display: grid;
        grid-template-areas: ". up ." "left . right" ". down .";
        gap: 4px;
        opacity: 0.75;
      }
      .ed-pan:hover { opacity: 1; }
      .ed-pan-btn {
        width: 44px;
        height: 44px;
        font-size: 15px;
        color: #f4e4c1;
        background: rgba(59, 42, 28, 0.85);
        border: 2px solid #6b4f34;
        border-radius: 10px;
        cursor: pointer;
        touch-action: none;
      }
      .ed-pan-btn:hover { border-color: #9a7345; }
      .ed-pan-btn:active { background: #56a03a; color: #10240c; }
      .ed-pan-up { grid-area: up; }
      .ed-pan-left { grid-area: left; }
      .ed-pan-right { grid-area: right; }
      .ed-pan-down { grid-area: down; }
    </style>
  </head>
  <body>
    <div id="editor">
      <aside id="sidebar"></aside>
      <canvas id="board-canvas"></canvas>
    </div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
