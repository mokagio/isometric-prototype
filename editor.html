<!doctype html>
<html lang="en">
  <head>
    <title>Map Editor | Games Playground</title>
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        background: #1b2b1a;
        font-family: Georgia, "Times New Roman", serif;
      }
      #board-canvas {
        flex: 1 1 auto;
        min-width: 0;
        cursor: crosshair;
      }

      .ed-height { display: flex; align-items: center; gap: 8px; }
      .ed-step {
        width: 40px;
        height: 40px;
        font-size: 16px;
        color: #f4e4c1;
        background: #3b2a1c;
        border: 2px solid #6b4f34;
        border-radius: 8px;
        cursor: pointer;
      }
      .ed-step:hover { border-color: #9a7345; }
      .ed-height-value {
        flex: 1;
        text-align: center;
        font-size: 22px;
        color: #f4e4c1;
      }
    </style>
  </head>
  <body>
    <div id="editor">
      <aside id="sidebar"></aside>
      <canvas id="board-canvas"></canvas>
    </div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
