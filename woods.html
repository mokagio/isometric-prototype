<!doctype html>
<html lang="en">
  <head>
    <title>Whispering Woods | Games Playground</title>
    <!-- The menu, stick and action-button rules live in `src/chrome.css`, which
         `sharedHead.ts` links into every page. What is below is this game's. -->
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        background: #28501f;
      }

      /* The tally of logs carried, top-left where Peaceful Plains keeps its hearts. */
      .ww-logs {
        position: fixed;
        top: var(--ww-inset-top);
        left: var(--ww-inset-left);
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--ww-pixel);
        font-size: 24px;
        color: #f4e4c1;
        /* It sits straight on bright grass, so it needs an outline to read. */
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        user-select: none;
      }
      .ww-logs-icon {
        width: 44px;
        height: 44px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
      }

    </style>
  </head>
  <body>
    <canvas id="woods"></canvas>
    <script type="module" src="/src/woods/main.ts"></script>
  </body>
</html>
