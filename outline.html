<!doctype html>
<html lang="en">
  <head>
    <title>Island Outline | Games Playground</title>
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        background: #0099db;
        font-family: Georgia, "Times New Roman", serif;
      }
      #outline-canvas {
        flex: 1 1 auto;
        min-width: 0;
        cursor: crosshair;
      }
      /* Three across: every swatch here is one tile, so they stay legible small
         and the whole of a group fits without scrolling. */
      #sidebar .ed-palette { grid-template-columns: repeat(3, 1fr); }
      /* Which cell the mouse is over and what is in it, for reading a drawing
         back against the file it saves. */
      #readout {
        position: fixed;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        padding: 2px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        pointer-events: none;
        white-space: pre;
      }
      #readout:empty { display: none; }
      /* Undo, redo, the zoom and the arrows can all have nowhere to go. */
      .ed-tool:disabled { opacity: 0.4; cursor: default; }
      .ed-tool:disabled:hover { border-color: #6b4f34; }
      .ed-pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 6px;
      }
      .ed-pad .ed-tool { font-size: 17px; padding: 5px 0; }
      .ed-pad-gap { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="editor">
      <aside id="sidebar"></aside>
      <canvas id="outline-canvas"></canvas>
    </div>
    <div id="readout"></div>
    <script type="module" src="/src/woods/outline/main.ts"></script>
  </body>
</html>
